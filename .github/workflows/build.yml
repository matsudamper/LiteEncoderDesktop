name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.name.outputs.artifact_name }}
      msi_artifact_url: ${{ steps.upload_msi.outputs.artifact-url }}
      s3_url: ${{ steps.upload_s3.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6のデフォルト(enhanced)は商用キャッシュサービスのため、OSSのGitHub Actions cache実装を使う
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build
        run: ./gradlew build
      - name: Package (MSI)
        run: ./gradlew packageMsi
      - name: Rename MSI with branch and short hash
        id: name
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          # GITHUB_SHA はマージコミットのため、PR 上のコミットと一致する head の SHA を使う
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          SAFE_REPO="${REPOSITORY##*/}"
          SAFE_BRANCH="$(echo "${BRANCH_NAME}" | sed 's/[^A-Za-z0-9._-]/-/g')"
          ARTIFACT_NAME="${SAFE_REPO}-installer-win-${SAFE_BRANCH}-${SHORT_SHA}"
          MSI_DIR="build/compose/binaries/main/msi"
          SOURCE_MSI="$(ls "${MSI_DIR}"/*.msi | head -n 1)"
          mv "${SOURCE_MSI}" "${MSI_DIR}/${ARTIFACT_NAME}.msi"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "MSI_PATH=${MSI_DIR}/${ARTIFACT_NAME}.msi" >> "$GITHUB_ENV"
      - name: Upload MSI to GitHub Artifacts
        id: upload_msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ${{ env.MSI_PATH }}
      - name: Upload MSI to S3
        id: upload_s3
        if: github.event_name == 'pull_request'
        uses: matsudamper/actions/upload-matsudamper-s3@6f7068834e08294360d6e5987869a5f50c924c66 # v1.0.1
        continue-on-error: true
        with:
          file_path: ${{ env.MSI_PATH }}

  report-artifacts:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
    steps:
      - name: Compose artifact download links
        id: artifact_links
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          MSI_ARTIFACT_URL: ${{ needs.build.outputs.msi_artifact_url }}
          S3_URL: ${{ needs.build.outputs.s3_url }}
          BUILD_JOB_RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$BUILD_JOB_RESULT" != "success" ] || [ -z "$MSI_ARTIFACT_URL" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$S3_URL" ]; then
            s3_row="| ☁️ S3 (MSI) | - | [Download](${S3_URL}) |"
          else
            s3_row="| ☁️ S3 (MSI) | - | ⚠️ アップロード失敗 ([run](${RUN_URL})) |"
          fi

          echo "failed=false" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            echo "✅ Installer build is ready!"
            echo ""
            echo "| Storage | 圧縮方式 | Download Link |"
            echo "| :--- | :--- | :--- |"
            echo "| 🐙 GitHub Artifacts (MSI) | zip | [Download](${MSI_ARTIFACT_URL}) |"
            echo "${s3_row}"
            echo ""
            echo "---"
            echo "*Artifact Name: \`${ARTIFACT_NAME}\`*"
            echo "*Commit: [\`${HEAD_SHA}\`](${COMMIT_URL})*"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky PR comment (artifacts)
        # 失敗時は投稿せず、前回成功時のコメントを残す
        if: steps.artifact_links.outputs.failed != 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: liteencoderdesktop-artifacts
          recreate: true
          message: ${{ steps.artifact_links.outputs.message }}
